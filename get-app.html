<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>NBE Mobile</title>
<script>
  /* The booth QR code opens this file. Phones are sent to their store before anything is drawn. */
  var STORES = {
    apple: 'https://apps.apple.com/eg/app/nbe-mobile/id1596302687',
    play: 'https://play.google.com/store/apps/details?id=com.ofss.obdx.and.nbe.com.eg'
  };
  function storeFor(ua, touchPoints) {
    if (/android/i.test(ua)) return 'play';
    // iPads identify themselves as Macs, but Macs have no touchscreen
    if (/iphone|ipad|ipod/i.test(ua) || (/macintosh/i.test(ua) && touchPoints > 1)) return 'apple';
    return null;
  }
  var store = storeFor(navigator.userAgent, navigator.maxTouchPoints || 0);
  if (store) {
    document.documentElement.style.visibility = 'hidden';
    location.replace(STORES[store]);
    // Only seen if the store did not open
    setTimeout(function () { document.documentElement.style.visibility = ''; }, 3000);
  }
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; box-sizing: border-box; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fff; }
  a { width: 100%; max-width: 300px; padding: 15px 0; border-radius: 26px; background: #00643E; color: #fff; font-size: 16px; text-align: center; text-decoration: none; }
</style>
</head>
<body>
  <a href="https://apps.apple.com/eg/app/nbe-mobile/id1596302687">App Store</a>
  <a href="https://play.google.com/store/apps/details?id=com.ofss.obdx.and.nbe.com.eg">Google Play</a>
</body>
</html>
