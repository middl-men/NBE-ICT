<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>NBE at ICT 2026</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="css/app.css?v=20261030-7">
</head>
<body data-stage="boot">
<div id="stage">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div id="vignette" aria-hidden="true"></div>

  <!-- Fallback emblem, used only when WebGL is unavailable -->
  <div id="flatEmblem" aria-hidden="true"></div>

  <!-- 1. ATTRACT -->
  <section id="attract" class="layer">
    <h1 class="mega" id="attractTitle"></h1>
    <p class="attract-sub" id="attractSub"></p>
    <div class="touch">
      <div class="touch-ring"><i></i><i></i><i></i><b></b></div>
      <div class="touch-label" id="attractCta"></div>
    </div>
  </section>

  <!-- 2. WELCOME -->
  <section id="welcome" class="layer">
    <h1 class="mega" id="welcomeTitle"></h1>
    <p class="lede" id="welcomeSub"></p>
    <button class="cta-gold" id="getStarted" type="button"><span id="getStartedLabel"></span><svg viewBox="0 0 24 24" class="flip" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </section>

  <!-- 3. ONBOARDING: caption and journey track around the phone -->
  <section id="onboard" class="layer">
    <div class="caption"><h2 id="capTitle"></h2></div>
    <div class="track-wrap">
      <div class="track" id="track"><div class="track-fill" id="trackFill"></div></div>
      <div class="track-note"><span class="tap-dot"></span><span id="trackHint"></span><em id="trackDemo"></em></div>
    </div>
  </section>

  <img id="flyer" alt="" aria-hidden="true">

  <!-- The one phone that travels through Welcome and Onboarding -->
  <div id="phoneRig" aria-live="polite">
    <div id="phoneTilt">
      <div class="phone">
        <i class="side-btn a"></i><i class="side-btn b"></i><i class="side-btn c"></i>
        <div class="screen">
          <div class="screen-scale" id="screen">
            <div class="views" id="views"></div>
            <div class="statusbar" id="statusbar" dir="ltr">
              <span>9:41</span>
              <svg viewBox="0 0 68 14" aria-hidden="true"><g fill="currentColor"><rect x="0" y="9" width="3" height="4" rx="1"/><rect x="5" y="6.5" width="3" height="6.5" rx="1"/><rect x="10" y="4" width="3" height="9" rx="1"/><rect x="15" y="1" width="3" height="12" rx="1"/><path d="M31 3.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 31 1.4c-2.8 0-5.3 1.1-7.2 2.9L25 5.6a8.7 8.7 0 0 1 6-2.4zm0 3.7c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.8 6.8 0 0 0 31 5.1c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3zm0 3.5-2 2.1 2 .1 2-.1z"/><rect x="44.5" y="2" width="20" height="10.5" rx="3" fill="none" stroke="currentColor" opacity=".5"/><rect x="46" y="3.5" width="17" height="7.5" rx="1.8"/><rect x="65.5" y="5.5" width="1.5" height="3.5" rx=".7" opacity=".5"/></g></svg>
            </div>
            <div class="island"></div>
            <div class="homebar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 4. COMPLETION -->
  <section id="done" class="layer">
    <h1 class="mega" id="doneTitle"></h1>
    <div class="qr-row" id="qrRow"></div>
    <div class="scan-label" id="doneScan"></div>
    <button class="ghost-btn" id="restart" type="button">
      <svg viewBox="0 0 48 48" class="timer" aria-hidden="true"><circle cx="24" cy="24" r="21"/><circle id="restartRing" cx="24" cy="24" r="21" pathLength="100"/></svg>
      <span id="restartLabel"></span>
    </button>
  </section>

  <!-- Persistent chrome -->
  <button id="logo" type="button" aria-label="National Bank of Egypt"></button>
  <div id="chrome">
    <button class="pill" id="langBtn" type="button"></button>
    <button class="pill" id="exitBtn" type="button"></button>
  </div>

  <!-- Inactivity -->
  <div id="idle">
    <div class="idle-ring">
      <svg viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92"/><circle id="idleRing" cx="100" cy="100" r="92" pathLength="100"/></svg>
      <span id="idleCount"></span>
    </div>
    <h2 id="idleTitle"></h2>
    <p id="idleSub"></p>
  </div>

  <!-- Staff settings: hold the logo for 3 seconds -->
  <form id="admin" autocomplete="off">
    <h3>Booth settings</h3>
    <label>QR code link<input id="aQr" type="url" dir="ltr" required></label>
    <div class="row">
      <label>Idle (sec)<input id="aIdle" type="number" min="10" max="600" required></label>
      <label>Countdown (sec)<input id="aCount" type="number" min="3" max="60" required></label>
      <label>Completion (sec)<input id="aDone" type="number" min="10" max="600" required></label>
    </div>
    <div class="row">
      <label>Volume (0 to 1)<input id="aVol" type="number" min="0" max="1" step="0.05" required></label>
      <label>Start language<select id="aLang"><option value="en">English</option><option value="ar">العربية</option></select></label>
    </div>
    <div class="row actions">
      <button type="button" id="aReset">Reset to defaults</button>
      <button type="button" id="aCancel">Cancel</button>
      <button type="submit" class="primary">Save</button>
    </div>
  </form>
</div>

<script src="config.js?v=20261030-7"></script>
<script src="js/vendor/three.min.js?v=20261030-7"></script>
<script src="js/vendor/qrcode.js?v=20261030-7"></script>
<script src="js/brand-assets.js?v=20261030-7"></script>
<script src="js/background-data.js?v=20261030-7"></script>
<script src="js/i18n.js?v=20261030-7"></script>
<script src="js/scene.js?v=20261030-7"></script>
<script src="js/flow.js?v=20261030-7"></script>
<script src="js/app.js?v=20261030-7"></script>
</body>
</html>
